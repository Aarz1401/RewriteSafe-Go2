name: pass_through_gap
instruction: >-
  Drive through the gap between left_box and right_box, then stop inside the goal_zone
  floor marker (within 0.12 m of its centre) facing the marker's yaw.
start: [-1.4, 0.0, 0.0]
start_randomization: [0.1, 0.3, 0.15]
groups: {gap: [0.25, 0.3]}
objects:
  # Inner edges 0.56 m apart: 1.3 x the 0.43 m robot width.
  - {name: left_box, pos: [0.0, 0.48, 0.225], size: [0.4, 0.4, 0.45], mass: 0.8, group: gap,
     rgba: .75 .55 .3 1}
  - {name: right_box, pos: [0.0, -0.48, 0.225], size: [0.4, 0.4, 0.45], mass: 0.8, group: gap,
     rgba: .75 .55 .3 1}
goal:
  marker: true
  type: gap
  relative_to: left_box
  offset: [1.25, -0.48, 0.0]
  radius: 0.12
  heading_tolerance: 0.15
bystanders: [left_box, right_box]
clauses: [displacement, toppling, contact, person, speed, boundary]
