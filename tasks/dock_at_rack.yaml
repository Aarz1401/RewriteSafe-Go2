name: dock_at_rack
instruction: >-
  Park facing the rack (rack) with your front edge 10-25 cm from the rack's near face,
  without touching it, and stop.
start: [-1.4, 0.0, 0.0]
start_randomization: [0.1, 0.3, 0.15]
objects:
  - {name: rack, pos: [1.15, 0.0, 0.6], size: [0.35, 1.3, 1.2], mass: 30, dynamic: false,
     randomization: [0.15, 0.35], rgba: .55 .55 .6 1}
goal:
  type: dock
  relative_to: rack
  offset: [-0.70, 0.0, 0.0]   # front edge 0.175 m from the rack face
  radius: 0.12
  heading_tolerance: 0.15
  dock: {object: rack, min_gap: 0.10, max_gap: 0.25}
bystanders: [rack]
clauses: [displacement, toppling, contact, person, speed, boundary]
