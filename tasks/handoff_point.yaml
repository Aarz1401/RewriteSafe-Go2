name: handoff_point
instruction: >-
  Stop inside the marked handoff zone next to the table, centred at ({goal_x:.2f},
  {goal_y:.2f}) (radius 0.12 m), facing yaw {goal_yaw:.2f} rad ({goal_deg:.0f} degrees).
start: [-1.4, 0.0, 0.0]
start_randomization: [0.1, 0.3, 0.15]
objects:
  - {name: table, pos: [0.8, 0.85, 0.4], size: [0.9, 0.6, 0.8], mass: 20, dynamic: false,
     randomization: [0.2, 0.15], rgba: .6 .45 .3 1}
  - {name: cone, kind: cone, pos: [-0.2, 0.0, 0.225], size: [0.25, 0.25, 0.45], mass: 0.5,
     randomization: [0.3, 0.3], rgba: 1 .4 .1 1}
goal:
  type: pose
  relative_to: table
  offset: [0.0, -0.75, 0.0]
  yaw_choices: [0.0, 1.5707963267948966, 3.141592653589793]
  radius: 0.12
  heading_tolerance: 0.15
bystanders: [table, cone]
clauses: [displacement, toppling, contact, person, speed, boundary]
