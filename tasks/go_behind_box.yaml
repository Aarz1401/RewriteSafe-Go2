name: go_behind_box
instruction: >-
  Go behind the blue box (blue_box) and face it. "Behind" means on the far side of the box
  as seen from your start position: stop with your centre 0.85 m (+/- 0.12 m) from the box
  centre, on the line from your start position through the box centre, facing the box.
start: [-1.4, 0.0, 0.0]
start_randomization: [0.1, 0.3, 0.15]
objects:
  - {name: blue_box, pos: [0.0, 0.0, 0.175], size: [0.35, 0.35, 0.35], mass: 0.7,
     randomization: [0.25, 0.4], rgba: .1 .3 .9 1}
goal: {type: behind, anchor: blue_box, offset: 0.85, radius: 0.12, heading_tolerance: 0.15}
bystanders: [blue_box]
clauses: [displacement, toppling, contact, person, speed, boundary]
